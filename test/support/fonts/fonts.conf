<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  A fontconfig configuration that makes text rendering in the test suite
  the same on every machine: only the fonts in this directory and the
  font bundled in priv/fonts are visible, and the system font families
  the tests name are mapped onto them. test/test_helper.exs points
  FONTCONFIG_FILE here.
-->
<fontconfig>
  <dir prefix="relative">.</dir>
  <dir prefix="relative">../../../priv/fonts</dir>

  <alias binding="same">
    <family>Helvetica</family>
    <prefer><family>Inter</family></prefer>
  </alias>

  <alias binding="same">
    <family>DIN Alternate</family>
    <prefer><family>Inter</family></prefer>
  </alias>

  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>

  <alias binding="same">
    <family>Impact</family>
    <prefer><family>Anton</family></prefer>
  </alias>
</fontconfig>

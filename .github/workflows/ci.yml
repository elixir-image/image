name: Elixir CI

# Define workflow that runs when changes are pushed to the
# `main` branch or pushed to a PR branch that targets the `main`
# branch. Change the branch name if your project uses a
# different name for the main branch like "master" or "production".
on:
  push:
    branches: [ "main" ]  # adapt branch for project
  pull_request:
    branches: [ "main" ]  # adapt branch for project

# Sets the ENV `MIX_ENV` to `test` for running tests
env:
  MIX_ENV: test
  EVISION_PREFER_PRECOMPILED: true
  # VIX_COMPILATION_MODE: PLATFORM_PROVIDED_LIBVIPS
  VIX_COMPILATION_MODE: PRECOMPILED_NIF_AND_LIBVIPS
  # What xav's Makefile asks pkg-config for. Changing this list changes
  # the Ubuntu package cache key.
  APT_PACKAGES: pkg-config libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libavdevice-dev
  # Text is rendered with fontconfig and the fonts in test/support/fonts, so
  # the text reference images match on every platform (see test_helper.exs).
  PANGOCAIRO_BACKEND: fc
  FONTCONFIG_FILE: ${{ github.workspace }}/test/support/fonts/fonts.conf

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test on OTP ${{matrix.otp}} / Elixir ${{matrix.elixir}}
    # The S3 streaming tests (test/stream_image_s3_test.exs, tagged :s3) run
    # against Adobe S3Mock. config/test.exs expects an S3 endpoint on
    # 127.0.0.1:9000, so the container's HTTP port 9090 is published there,
    # and the bucket the tests use is created when the container starts.
    services:
      s3mock:
        image: adobe/s3mock:5.2.3
        ports:
          - 9000:9090
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: images
    strategy:
      fail-fast: false
      # Specify the OTP and Elixir versions to use when building
      # and running the workflow steps.
      # Since Bumblebee required OTP 26 (because of Req/Finch/Telemetry)
      # we only test on OTP 26 and later. Non-bumblebee installs will
      # also work on OTP 25.
      matrix:
        include:
          # OTP 26.2.5.8+ is required: earlier 26.x patches reject the
          # builds.hex.pm certificate chain with a TLS key_usage_mismatch
          # (fixed by public_key OTP-19240 / erlang/otp#9286). The generic
          # "26" specifier resolves to a current patch that satisfies this.

          # Elixir 1.17 — supports OTP 25–27
          - elixir: "1.17.3-otp-26"
            otp: "26.2.5.21"
          - elixir: "1.17.3-otp-27"
            otp: "27.3.4.20"

          # Elixir 1.18 — supports OTP 25–27
          - elixir: "1.18.6-otp-26"
            otp: "26.2.5.21"
          - elixir: "1.18.6-otp-27"
            otp: "27.3.4.20"

          # Elixir 1.19 — supports OTP 26–28
          - elixir: "1.19.7-otp-26"
            otp: "26.2.5.21"
          - elixir: "1.19.7-otp-27"
            otp: "27.3.4.20"
          - elixir: "1.19.7-otp-28"
            otp: "28.5.0.9"

          # Elixir 1.20 — supports OTP 27–29. The 1.20.5-otp-29 entry is the
          # canonical toolchain and the lint entry (format, credo,
          # warnings-as-errors, dialyzer, docs).
          - elixir: "1.20.5-otp-27"
            otp: "27.3.4.20"
          - elixir: "1.20.5-otp-28"
            otp: "28.5.0.9"
          - elixir: "1.20.5-otp-29"
            otp: "29.1.3"
            lint: true
    steps:
    # Step: Setup Elixir + Erlang image as the base.
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        otp-version: ${{matrix.otp}}
        elixir-version: ${{matrix.elixir}}

    # Step: Check out the code.
    - name: Checkout code
      uses: actions/checkout@v7

    # Step: Cache deps and the compiled build. The key carries both the
    # Elixir and the OTP patch, because BEAM files are version-tagged and
    # a key without the OTP version hands one row another row's artifacts.
    - name: Restore dependency cache
      uses: actions/cache@v6
      with:
        path: |
          deps
          _build
        key: mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
        restore-keys: |
          mix-${{ matrix.elixir }}-${{ matrix.otp }}-

    # vix loads its own precompiled libvips (VIX_COMPILATION_MODE above),
    # so no system libvips is built. The only native code compiled from
    # source is xav's NIF, which needs the ffmpeg development packages.
    # Their .deb files are cached, so a slow Ubuntu mirror only matters
    # when the package list or the Ubuntu release changes.
    - name: Identify the Ubuntu release and package list
      run: |
        . /etc/os-release
        echo "UBUNTU_RELEASE=${ID}${VERSION_ID}" >> $GITHUB_ENV
        echo "APT_PACKAGES_HASH=$(echo "${APT_PACKAGES}" | sha256sum | cut -c1-16)" >> $GITHUB_ENV

    - name: Cache Ubuntu packages
      uses: actions/cache@v6
      with:
        path: ~/apt-archives
        key: apt-${{ env.UBUNTU_RELEASE }}-${{ env.APT_PACKAGES_HASH }}
        restore-keys: |
          apt-${{ env.UBUNTU_RELEASE }}-

    - name: Update the Ubuntu package lists
      timeout-minutes: 10
      run: sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 update

    # The install usually takes under a minute, but a slow mirror has
    # stretched a successful one to 30 minutes and a stalled one hung it
    # for 38 before failing. The timeout allows for a slow mirror on a
    # cache miss while still stopping one that never finishes.
    - name: Install the ffmpeg development packages
      timeout-minutes: 35
      run: |
        mkdir -p ~/apt-archives/partial
        sudo apt-get -y \
          -o Acquire::Retries=5 \
          -o Acquire::http::Timeout=60 \
          -o Dir::Cache::archives="${HOME}/apt-archives" \
          install ${APT_PACKAGES}
        # apt leaves a root-owned lock and partial directory that the
        # cache step cannot read.
        sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
        sudo chown -R "$(id -u):$(id -g)" ~/apt-archives

    # Step: Download project dependencies. If unchanged, uses
    # the cached version.
    - name: Install dependencies
      run: mix deps.get

    # Step: Compile the project treating any warnings as errors.
    # Customize this step if a different behavior is desired.
    - name: Compiles without warnings
      run: mix compile --warnings-as-errors
      if: ${{ matrix.lint }}

    # Step: Check that the checked in code has already been formatted.
    # This step fails if something was found unformatted.
    - name: Check formatting
      run: mix format --check-formatted
      if: ${{ matrix.lint }}

    # The service container may still be starting when the job reaches here.
    - name: Wait for S3Mock
      run: curl --silent --output /dev/null --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:9000/

    # Step: Execute the tests, including the S3 streaming tests. S3Mock
    # accepts any credentials, but config/test.exs reads them from these
    # variables and ExAws refuses to sign a request without them.
    - name: Run tests
      run: mix test --include s3
      env:
        MINIO_ROOT_USER: s3mock
        MINIO_ROOT_PASSWORD: s3mock

    # Step: Cache the dialyzer PLT. Keyed on both versions for the same
    # reason as the build cache.
    - name: Restore PLT cache
      uses: actions/cache@v6
      if: ${{ matrix.lint }}
      with:
        path: _build/dev/dialyxir_*
        key: plt-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
        restore-keys: |
          plt-${{ matrix.elixir }}-${{ matrix.otp }}-

    # Step: Execute dialyzer. Runs in the dev env, which is where the
    # PLT above is built and cached.
    - name: Run dialyzer
      run: mix dialyzer
      if: ${{ matrix.lint }}
      env:
        MIX_ENV: dev

    # Step: Enforce the Credo policy (see .credo.exs).
    - name: Run Credo
      run: mix credo --strict
      if: ${{ matrix.lint }}

    # Step: Build the docs and fail on any doc warning (broken references,
    # malformed examples). Runs in the release env per the DoD.
    - name: Check docs
      run: mix docs --warnings-as-errors
      if: ${{ matrix.lint }}
      env:
        MIX_ENV: release
